<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cyberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64f0fc"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#00f59b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Background -->
  <rect width="100" height="100" rx="16" fill="#06080e"/>
  
  <!-- Outer Circuit Nodes -->
  <circle cx="31" cy="46" r="1.8" fill="#64f0fc" opacity="0.8"/>
  <circle cx="58" cy="63" r="1.8" fill="#00f59b" opacity="0.8"/>

  <!-- Left Outer Wing -->
  <polygon points="22,25 35,28 28,45 20,38" fill="url(#cyberGrad)" opacity="0.75" filter="url(#glow)"/>
  
  <!-- Left Main Wing -->
  <polygon points="36,30 50,75 43,75 29,48" fill="url(#cyberGrad)" filter="url(#glow)"/>
  
  <!-- Right Main Wing -->
  <polygon points="64,30 50,75 57,75 71,48" fill="url(#cyberGrad)" filter="url(#glow)"/>
  
  <!-- Right Outer Wing -->
  <polygon points="78,25 65,28 72,45 80,38" fill="url(#cyberGrad)" opacity="0.75" filter="url(#glow)"/>

  <!-- Central V Core Facet -->
  <polygon points="50,48 50,75 46,67" fill="#a5f3fc" opacity="0.9"/>
  <polygon points="50,48 50,75 54,67" fill="#64f0fc" opacity="0.8"/>
</svg>
