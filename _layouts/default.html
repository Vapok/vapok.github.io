<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO, Open Graph & Social Preview -->
  {% include seo-meta.html %}
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="{{ '/assets/css/terminal.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  
  <!-- Favicon / Brand Meta -->
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/images/favicon.svg' | relative_url }}">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/images/favicon-32x32.png' | relative_url }}">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/images/favicon-16x16.png' | relative_url }}">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ '/assets/images/apple-touch-icon.png' | relative_url }}">
  <link rel="manifest" href="{{ '/site.webmanifest' | relative_url }}">
  <meta name="theme-color" content="#06080e">
  
  <script>
    (function() {
      try {
        var booted = localStorage.getItem('vapok_system_booted');
        if (booted !== 'true') {
          document.documentElement.classList.add('system-offline');
        }
      } catch (e) {}
    })();
  </script>
  
  <!-- Analytics -->
  {% include google-analytics.html %}
</head>
<body id="top">
  <!-- Skip to Main Content (WCAG 2.4.1 Bypass Blocks) -->
  <a href="#main-content" class="skip-to-content">[ ↵ SKIP TO MAIN CONTENT ]</a>

  <!-- Interactive ASCII Background Canvas -->
  <canvas id="ascii-bg-canvas" aria-hidden="true"></canvas>

  <!-- CRT Scanline Filter Layer -->
  <div class="crt-overlay" aria-hidden="true"></div>

  <!-- Site Content Container -->
  <div class="site-wrapper">
    {% include header.html %}

    <main id="main-content">
      {{ content }}
    </main>

    {% include footer.html %}
  </div>

  <!-- Mobile Back-to-Top Quick Return Button -->
  <button id="mobile-back-to-top" class="mobile-back-to-top" aria-label="Back to Top" title="Return to top of page">[ ▲ TOP ]</button>

  <!-- Fullscreen Cyber Lightbox Modal -->
  {% include cyber-lightbox.html %}

  <!-- JavaScript Engine & BBS Doors -->
  <script src="{{ '/assets/js/bbs-doors.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
  <script src="{{ '/assets/js/terminal-fx.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>

  <!-- Cookie & Telemetry Consent Banner -->
  {% include cookie-banner.html %}
</body>
</html>
