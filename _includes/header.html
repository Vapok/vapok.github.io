<header class="cyber-header">
  <div class="system-status-bar">
    <div class="status-indicator">
      <span id="system-status-dot" class="status-dot"></span>
      <span>SYS_NODE: [ vapok.io ]</span>
      <span style="color: var(--text-dim)">|</span>
      <span>STATUS: <strong id="system-status-text" style="color: var(--glacial-mint)">ONLINE</strong></span>
    </div>
    
    <div class="header-controls">
      <span id="system-clock" style="color: var(--text-muted)">--:--:-- UTC</span>
      <a href="{{ '/support/' | relative_url }}" id="header-fuel-btn" class="ctrl-btn fuel-btn scramble-hover" data-text="[ ⚡ FUEL: $$$ ]" title="Donate & Support Vapok Gaming" style="color: var(--warning-amber); border-color: rgba(251, 191, 36, 0.45); text-decoration: none;">[ ⚡ FUEL: $$$ ]</a>
      <button id="cli-toggle-btn" class="ctrl-btn" title="Toggle Interactive CLI Terminal">[ CLI: >_ ]</button>
      <button id="crt-toggle-btn" class="ctrl-btn" title="Toggle CRT Scanline Effect">[ CRT: ON ]</button>
    </div>
  </div>

  <div class="nav-container">
    <div class="terminal-prompt-brand" id="terminal-brand-btn" role="button" tabindex="0" title="Click to toggle Terminal Prompt (~)">
      <span class="prompt-prefix">user@vapok.io:~$</span>
      <span class="prompt-cursor">█</span>
      <span class="prompt-anchor-badge">[TTY-1]</span>
    </div>

    <nav id="header-nav-menu">
      <ul class="nav-menu">
        {% for link in site.nav_links %}
          <li>
            <a href="{{ link.url | relative_url }}" class="nav-link {% if page.url == link.url %}active{% endif %}">
              {{ link.title }}
            </a>
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>

  <!-- INTERACTIVE CLI TERMINAL DRAWER -->
  <div id="cyber-cli-drawer" class="cyber-cli-drawer">
    <div class="cli-drawer-header">
      <div class="cli-title">
        <span style="color: var(--ice-blue);">// VAPOK_IO_TERMINAL_EMULATOR</span>
        <span class="cli-sub">[ v2026.1 // TTY-1 ]</span>
      </div>
      <div class="cli-controls">
        <button id="cli-boot-quick-btn" class="cli-mini-btn" style="color: var(--warning-amber); border-color: rgba(251, 191, 36, 0.4);">[ ⚡ START ]</button>
        <button id="cli-help-quick-btn" class="cli-mini-btn">[ ❓ HELP ]</button>
        <button id="cli-clear-quick-btn" class="cli-mini-btn">[ 🧹 CLEAR ]</button>
        <button id="cli-close-btn" class="cli-mini-btn" style="color: var(--text-muted);">[ ✕ CLOSE ]</button>
      </div>
    </div>

    <div id="cli-output" class="cli-output-window">
      <!-- Dynamic CLI Messages Injected by JavaScript -->
    </div>

    <form id="cli-form" class="cli-input-line">
      <span class="cli-prompt-label">user@vapok.io:~$</span>
      <input type="text" id="cli-input" class="cli-input-field" placeholder="Enter command (e.g. boot, help, status, mods, games)..." autocomplete="off" spellcheck="false">
      <button type="submit" class="cli-submit-btn">[ EXEC ]</button>
    </form>
  </div>
</header>
