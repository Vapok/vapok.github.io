{% if site.google_analytics and jekyll.environment == "production" %}
<!-- Google tag (gtag.js) with Consent Mode v2 -->
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.google_analytics }}"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}

  // Check persisted consent status before initializing
  var storedConsent = null;
  try {
    storedConsent = localStorage.getItem('vapok_cookie_consent');
  } catch (e) {}

  var analyticsConsent = (storedConsent === 'granted') ? 'granted' : 'denied';

  // Default consent settings (Google Consent Mode v2)
  gtag('consent', 'default', {
    'analytics_storage': analyticsConsent,
    'ad_storage': 'denied',
    'ad_user_data': 'denied',
    'ad_personalization': 'denied'
  });

  gtag('js', new Date());
  gtag('config', '{{ site.google_analytics }}');
</script>
{% endif %}
