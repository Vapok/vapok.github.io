<!-- FULLSCREEN CYBER LIGHTBOX -->
<div id="cyber-lightbox" class="cyber-lightbox" role="dialog" aria-modal="true" aria-hidden="true" style="display: none;">
  <div class="cyber-lightbox-backdrop"></div>
  <div class="cyber-lightbox-content">
    <div class="cyber-lightbox-header">
      <div class="cyber-lightbox-title-wrap">
        <span class="cyber-lightbox-id">// INTEL_VIEWER</span>
        <h4 id="cyber-lightbox-title" class="cyber-lightbox-title">Screenshot Title</h4>
      </div>
      <div class="cyber-lightbox-tools">
        <span id="cyber-lightbox-counter" class="cyber-lightbox-counter">[ 01 / 08 ]</span>
        <button type="button" class="cyber-lightbox-close cyber-btn" aria-label="Close Lightbox">[ X CLOSE (ESC) ]</button>
      </div>
    </div>
    <div class="cyber-lightbox-stage">
      <button type="button" class="cyber-lightbox-nav cyber-lightbox-prev cyber-btn" aria-label="Previous image">[ &lt; PREV ]</button>
      <div class="cyber-lightbox-img-box">
        <img id="cyber-lightbox-img" src="" alt="Full Resolution Screenshot" class="cyber-lightbox-img">
      </div>
      <button type="button" class="cyber-lightbox-nav cyber-lightbox-next cyber-btn" aria-label="Next image">[ NEXT &gt; ]</button>
    </div>
    <div class="cyber-lightbox-footer">
      <p id="cyber-lightbox-desc" class="cyber-lightbox-desc"></p>
    </div>
  </div>
</div>
